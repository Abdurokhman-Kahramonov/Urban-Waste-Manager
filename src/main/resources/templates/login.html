<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Urban Waste Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/app.js"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center justify-center">
    <div class="bg-white p-8 rounded shadow-md w-96">
        <h2 class="text-2xl font-bold mb-4 text-center">Login</h2>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">Sign In</button>
        </form>
        <p id="error" class="text-red-500 mt-2 text-sm hidden"></p>
        <div class="mt-4 text-center">
             <a href="/" class="text-blue-500 hover:underline">Back to Home</a>
        </div>
    </div>

    <script>
        // Clear any old session on load
        App.Auth.clearSession();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');

            try {
                // Use centralized API (though login is public, using helper is clean)
                // We use raw fetch or App.Api.post. App.Api auto-adds token but we don't have one yet.
                // It's safe to use App.Api.post as headers will just lack auth, which is fine for login.
                const data = await App.Api.post('/auth/login', { email, password }, { skipAuthCheck: true });

                App.Auth.saveSession(data);

                App.Auth.redirectBasedOnRole();

            } catch (err) {
                console.error(err);
                errorEl.textContent = 'Login failed. Check credentials.';
                errorEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
