version: '3.8'
services:
  postgres:
    image: postgres:13
    container_name: urban-waste-manager-postgres
    environment:
      POSTGRES_DB: urban_waste_manager
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: urban-waste-manager-app
    depends_on:
      - postgres
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/urban_waste_manager
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
